name: Daily UK49s Results Update - Timetable Based

on:
  schedule:
    # UK49s exact draw times (UTC) + backup every 30 min
    - cron: '49 10 * * *'  # Brunchtime 10:49 UTC
    - cron: '49 11 * * *'  # Lunchtime 11:49 UTC (12:45 UK time)
    - cron: '49 15 * * *'  # Drivetime 15:49 UTC
    - cron: '49 16 * * *'  # Teatime 16:49 UTC
    - cron: '0 19 * * *'   # SA Daily Lotto 21:00 SAST = 19:00 UTC
    - cron: '*/30 * * * *' # Safety backup
  workflow_dispatch:

jobs:
  update-lottery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Scraper & Update WP
        env:
          WP_USER: ${{ secrets.WP_USER }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          WP_PAGE_ID: "20"
        run: python uk49_bot.py
