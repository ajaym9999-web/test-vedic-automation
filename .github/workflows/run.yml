name: Build
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests beautifulsoup4
      - name: Generate results.json
        run: |
          if [ -f "uk49_results_generator.py" ]; then
            python uk49_results_generator.py
          elif [ -f "uk49_bot.py" ]; then
            python uk49_bot.py
          else
            echo "Generator not found"; ls -la; exit 1
          fi
      - name: Commit and Push
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add results.json history.json
          git diff --staged --quiet || git commit -m "auto update"
          git push
