name: Build
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python uk49_results_generator.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add history.json results.json
          git diff --staged --quiet || git commit -m "fix: clean history no duplicates"
          git push
