name: Test Vedic - Generate results.json

on:
  schedule:
    - cron: '55 11 * * *'  # 11:55 UTC = 5:25 PM IST Lunchtime
    - cron: '55 16 * * *'  # 16:55 UTC = 10:25 PM IST Teatime
    - cron: '*/30 * * * *' # backup every 30 min
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests beautifulsoup4

      - name: Generate results.json
        run: python uk49_results_generator.py

      - name: Commit and Push results.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json
          git diff --staged --quiet || git commit -m "Auto update results.json - $(date -u)"
          git push

      - name: Show file
        run: cat results.json
