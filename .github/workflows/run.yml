name: Test Lottery Auto Updater

on:
  schedule:
    # Traffic bachane ke liye exact draw ke 5 min baad
    - cron: '55 11 * * *'  # Lunchtime: 11:55 UTC = 5:25 PM IST
    - cron: '55 16 * * *'  # Teatime: 16:55 UTC = 10:25 PM IST
    # Backup har 30 min
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update-lottery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Run Scraper & Update WP - TEST
        env:
          WP_DOMAIN: https://test.vedicvibe.online
          WP_USER: ${{ secrets.WP_USER }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          WP_PAGE_ID: "20"
        run: python uk49_bot_test.py
